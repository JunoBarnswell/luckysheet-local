<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>P1 destroy-create-scroll regression</title>
    <link rel="stylesheet" href="../../dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="../../dist/plugins/plugins.css" />
    <link rel="stylesheet" href="../../dist/css/luckysheet.css" />
    <style>
        html, body { height: 100%; margin: 0; font-family: sans-serif; }
        #luckysheet { position: absolute; left: 0; top: 48px; right: 0; bottom: 0; }
        #report {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            height: 48px;
            overflow: auto;
            background: #111827;
            color: #f9fafb;
            padding: 8px 12px;
            font-size: 13px;
        }
        .pass { color: #34d399; }
        .fail { color: #f87171; }
        .skip { color: #fbbf24; }
    </style>
</head>
<body>
    <div id="report">destroy-create-scroll 回归：等待运行…</div>
    <div id="luckysheet"></div>
    <script src="../../dist/plugins/js/plugin.js"></script>
    <script src="../../dist/luckysheet.umd.js"></script>
    <script>
        (function () {
            var results = [];
            var report = document.getElementById("report");

            function record(name, ok, detail) {
                results.push({ name: name, ok: ok, detail: detail || "" });
            }

            function render() {
                var failed = results.filter(function (item) { return item.ok === false; }).length;
                var skipped = results.filter(function (item) { return item.ok == null; }).length;
                var passed = results.filter(function (item) { return item.ok === true; }).length;
                var lines = results.map(function (item) {
                    var cls = item.ok === true ? "pass" : (item.ok === false ? "fail" : "skip");
                    var mark = item.ok === true ? "PASS" : (item.ok === false ? "FAIL" : "SKIP");
                    return '<div class="' + cls + '">[' + mark + "] " + item.name + (item.detail ? " — " + item.detail : "") + "</div>";
                });
                report.innerHTML = "按例 " + passed + " 通过 / " + failed + " 失败 / " + skipped + " 跳过<br>" + lines.join("");
            }

            function wait(ms) {
                return new Promise(function (resolve) { setTimeout(resolve, ms); });
            }

            function makeWorkbook(scrollTop, name) {
                var celldata = [];
                for (var r = 0; r < 80; r++) {
                    celldata.push({ r: r, c: 0, v: { v: r + 1, m: String(r + 1) } });
                }
                var sheet = {
                    name: name || "scroll",
                    index: "0",
                    status: 1,
                    order: 0,
                    row: 80,
                    column: 10,
                    celldata: celldata
                };
                if (scrollTop != null) {
                    sheet.scrollTop = scrollTop;
                }
                return [sheet];
            }

            function readScrollTop() {
                var bar = document.getElementById("luckysheet-scrollbar-y");
                return bar ? bar.scrollTop : null;
            }

            function cloneWorkbook(sheets) {
                return JSON.parse(JSON.stringify(sheets));
            }

            async function run() {
                if (typeof luckysheet === "undefined" || typeof luckysheet.create !== "function") {
                    record("load luckysheet.umd.js", null, "Blocked：需要先产出 dist（Phase 5 gulp build）后再打开本页");
                    render();
                    return;
                }

                var noScrollSheets = makeWorkbook(null, "no-scroll");
                luckysheet.create({
                    container: "luckysheet",
                    showinfobar: false,
                    lang: "zh",
                    data: noScrollSheets
                });
                await wait(500);

                var bar = document.getElementById("luckysheet-scrollbar-y");
                if (!bar) {
                    record("scrollbar-y 存在", false, "首屏未找到纵向滚动条");
                    render();
                    return;
                }

                bar.scrollTop = 240;
                await wait(80);
                record("无 scrollTop 时可以滚动", readScrollTop() > 0, "scrollTop=" + readScrollTop());

                luckysheet.destroy();
                luckysheet.create({
                    container: "luckysheet",
                    showinfobar: false,
                    lang: "zh",
                    data: noScrollSheets
                });
                await wait(500);
                var afterRecreate = readScrollTop();
                record("无 scrollTop：滚动后 destroy→create 回到 0", afterRecreate === 0, "recreate scrollTop=" + afterRecreate);
                record("destroy 不改调用方 data[].scrollTop", noScrollSheets[0].scrollTop == null, "caller.scrollTop=" + noScrollSheets[0].scrollTop);

                var pinnedSheets = makeWorkbook(300, "pinned");
                var pinnedCopy = cloneWorkbook(pinnedSheets);
                luckysheet.create({
                    container: "luckysheet",
                    showinfobar: false,
                    lang: "zh",
                    data: pinnedSheets
                });
                await wait(500);
                var firstPinned = readScrollTop();
                record("scrollTop:300 首次 create 生效", firstPinned > 0, "first=" + firstPinned);

                luckysheet.destroy();
                luckysheet.create({
                    container: "luckysheet",
                    showinfobar: false,
                    lang: "zh",
                    data: pinnedCopy
                });
                await wait(500);
                var secondPinned = readScrollTop();
                record("scrollTop:300 recreate 与首次一致", Math.abs((firstPinned || 0) - (secondPinned || 0)) <= 2, "first=" + firstPinned + " second=" + secondPinned);
                record("recreate 不改调用方 scrollTop:300", pinnedCopy[0].scrollTop === 300, "caller.scrollTop=" + pinnedCopy[0].scrollTop);

                var otherBook = makeWorkbook(null, "other");
                luckysheet.destroy();
                luckysheet.create({
                    container: "luckysheet",
                    showinfobar: false,
                    lang: "zh",
                    data: otherBook
                });
                await wait(500);
                var otherScroll = readScrollTop();
                record("换 workbook 无残留 scroll", otherScroll === 0, "other.scrollTop=" + otherScroll);

                render();
            }

            window.addEventListener("load", function () {
                run().catch(function (err) {
                    record("runner", false, String(err && err.message ? err.message : err));
                    render();
                });
            });
        })();
    </script>
</body>
</html>
