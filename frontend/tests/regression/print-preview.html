<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>Print preview regression</title>
    <link rel="stylesheet" href="../../dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="../../dist/plugins/plugins.css" />
    <link rel="stylesheet" href="../../dist/css/luckysheet.css" />
    <style>
        html, body { height: 100%; margin: 0; font-family: sans-serif; }
        #luckysheet { position: absolute; left: 0; top: 72px; right: 0; bottom: 0; }
        #report { position: absolute; left: 0; top: 0; right: 0; height: 72px; overflow: auto; background: #111827; color: #f9fafb; padding: 8px 12px; font-size: 13px; }
        .pass { color: #34d399; }
        .fail { color: #f87171; }
    </style>
</head>
<body>
    <div id="report">print-preview 回归：等待运行…</div>
    <div id="luckysheet"></div>
    <script src="../../dist/plugins/js/plugin.js"></script>
    <script src="../../dist/luckysheet.umd.js"></script>
    <script src="./harness.js"></script>
    <script>
        (function () {
            var H = window.LsRegression;
            function sheet() {
                var celldata = [];
                for (var r = 0; r < 24; r++) {
                    for (var c = 0; c < 6; c++) {
                        celldata.push({ r: r, c: c, v: { v: r * 10 + c, m: String(r * 10 + c), f: c === 0 ? ("=" + (r + 1)) : undefined } });
                    }
                }
                return [{
                    name: "Print",
                    index: "0",
                    status: 1,
                    order: 0,
                    row: 30,
                    column: 10,
                    celldata: celldata,
                    config: {
                        printoptions: {
                            PrintArea: "$A$1:$F$12",
                            printOptions: { gridLines: 1, headings: 0 },
                            pageMargins: { left: 0.5, right: 0.5, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 },
                            pageSetup: { paperSize: 9, orientation: 2, scale: 100, draft: 0 }
                        }
                    }
                }];
            }

            H.tryLoadLuckysheet().then(function () {
                luckysheet.create({
                    container: "luckysheet",
                    lang: "zh",
                    data: sheet(),
                    plugins: [{ name: "print" }]
                });
                return H.wait(400);
            }).then(function () {
                H.assert(!!luckysheet.openPrintDialog, "openPrintDialog API");
                H.assert(!!luckysheet.print, "print API");
                H.assert(window.luckysheet && !!luckysheet.closePrintDialog, "closePrintDialog API");
                window.__printCalls = 0;
                window.print = function () { window.__printCalls += 1; };
                luckysheet.openPrintDialog();
                return H.wait(200);
            }).then(function () {
                var dlg = document.getElementById("luckysheet-print-dialog");
                H.assert(!!dlg, "print dialog exists");
                var canvases = document.querySelectorAll("#luckysheet-print-box canvas");
                H.assert(canvases.length > 0, "preview page count > 0", "pages=" + canvases.length);
                var printer = luckysheet.updatePrintConfig && luckysheet.updatePrintConfig({ area: "CurrentSelection" });
                H.assert(!!printer, "updatePrintConfig returns layout");
                H.assert(!!luckysheet.updatePrintConfig({ area: "AllSelection", paperSize: "Folio", pageSizeCustom: { w: 100, h: 200 } }), "full public layout fields update");
                return luckysheet.print({ layout: { area: "CurrentSheet", paperSize: "A4" } });
            }).then(function (result) {
                H.assert(result.pageCount > 0, "print returns page count");
                H.assert(window.__printCalls === 1, "system print invoked once");
                if (luckysheet.closePrintDialog) {
                    luckysheet.closePrintDialog();
                }
                H.assert(!document.getElementById("luckysheet-print-dialog"), "closePrintDialog removes dialog");
                H.summary();
            }).catch(function (err) {
                H.assert(false, "runtime", String(err && err.message || err));
                H.summary();
            });
        })();
    </script>
</body>
</html>
