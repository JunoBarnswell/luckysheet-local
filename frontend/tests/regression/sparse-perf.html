<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>性能测量：10 万稀疏格</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    .box { background: #f6f6f6; padding: 12px; }
    #luckysheet { width: 100%; height: 520px; position: relative; border: 1px solid #ccc; }
    #log { white-space: pre-wrap; background: #111; color: #eee; padding: 12px; min-height: 8em; }
  </style>
</head>
<body>
  <h1>Phase 2 性能测量页（不预填数字）</h1>
  <div class="box">
    <p>按 <code>docs/perf-baseline.md</code> 采集 Δheap / occupied / FPS。本页不声称任何分数。</p>
    <p>请先 <code>npm run build</code>，再用本地静态服务打开。</p>
    <button id="run-s1" type="button">加载 S1（10 万稀疏格）</button>
    <button id="run-fps" type="button" disabled>录 3s 滚动 rAF</button>
  </div>
  <div id="log">等待操作…</div>
  <div id="luckysheet"></div>
  <script src="./harness.js"></script>
  <script>
    (function () {
      var logEl = document.getElementById("log");
      function log(msg) {
        logEl.textContent += "\n" + msg;
      }
      LsRegression.tryLoadLuckysheet().then(function () {
        document.getElementById("run-s1").onclick = function () {
          var celldata = [];
          for (var i = 0; i < 100000; i++) {
            celldata.push({ r: i, c: i % 20, v: { v: i, m: String(i) } });
          }
          var before = performance.memory && performance.memory.usedJSHeapSize;
          luckysheet.create({
            container: "luckysheet",
            data: [{ name: "S1", index: "1", row: 100000, column: 20, celldata: celldata }]
          });
          requestAnimationFrame(function () {
            var after = performance.memory && performance.memory.usedJSHeapSize;
            var file = luckysheet.getluckysheetfile()[0];
            var json = luckysheet.toJson();
            log("logicalRC=" + file.data.length + "x" + (file.data[0] && file.data[0].length));
            log("celldataN=" + (json.data[0].celldata && json.data[0].celldata.length));
            log("data omitted in toJson=" + (json.data[0].data == null));
            log(before != null && after != null
              ? ("deltaHeap=" + (after - before))
              : "performance.memory 不可用，请用 DevTools Memory");
            document.getElementById("run-fps").disabled = false;
          });
        };
        document.getElementById("run-fps").onclick = function () {
          var n = 0, last = performance.now(), gaps = [];
          function tick(now) {
            n++;
            gaps.push(now - last);
            last = now;
            if (n < 180) requestAnimationFrame(tick);
            else {
              gaps.sort(function (a, b) { return a - b; });
              log("fps_scroll≈" + (n / 3).toFixed(1) + "  p95_frame_ms=" + gaps[Math.floor(gaps.length * 0.95)].toFixed(1));
              log("请同时拖动纵向滚动条，否则这只是空闲 rAF");
            }
          }
          log("开始 3s rAF，请拖动滚动条…");
          requestAnimationFrame(tick);
        };
      }).catch(function (err) {
        log(String(err));
      });
    })();
  </script>
</body>
</html>
