<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>P1 focus-scroll regression</title>
    <link rel="stylesheet" href="../../dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="../../dist/plugins/plugins.css" />
    <link rel="stylesheet" href="../../dist/css/luckysheet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; }
        .page-pad { height: 720px; background: #f3f4f6; }
        #outer-scroll {
            height: 640px;
            overflow: auto;
            border: 2px solid #2563eb;
        }
        #luckysheet {
            width: 100%;
            height: 1100px;
            position: relative;
        }
        #report {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #111827;
            color: #f9fafb;
            padding: 12px 16px;
            font-size: 14px;
        }
        .pass { color: #34d399; }
        .fail { color: #f87171; }
        .skip { color: #fbbf24; }
    </style>
</head>
<body>
    <div id="report">focus-scroll 回归：等待运行…</div>
    <div class="page-pad">页面顶部占位，用于制造 window 滚动</div>
    <div id="outer-scroll">
        <div id="luckysheet"></div>
    </div>
    <div class="page-pad">页面底部占位</div>
    <script src="../../dist/plugins/js/plugin.js"></script>
    <script src="../../dist/luckysheet.umd.js"></script>
    <script>
        (function () {
            var results = [];
            var report = document.getElementById("report");

            function record(name, ok, detail) {
                results.push({ name: name, ok: ok, detail: detail || "" });
            }

            function render() {
                var failed = results.filter(function (item) { return item.ok === false; }).length;
                var skipped = results.filter(function (item) { return item.ok == null; }).length;
                var passed = results.filter(function (item) { return item.ok === true; }).length;
                var lines = results.map(function (item) {
                    var cls = item.ok === true ? "pass" : (item.ok === false ? "fail" : "skip");
                    var mark = item.ok === true ? "PASS" : (item.ok === false ? "FAIL" : "SKIP");
                    return '<div class="' + cls + '">[' + mark + "] " + item.name + (item.detail ? " — " + item.detail : "") + "</div>";
                });
                report.innerHTML = "按例 " + passed + " 通过 / " + failed + " 失败 / " + skipped + " 跳过<br>" + lines.join("");
            }

            function wait(ms) {
                return new Promise(function (resolve) { setTimeout(resolve, ms); });
            }

            function createSheetOption(extra) {
                var option = {
                    container: "luckysheet",
                    fullscreenmode: false,
                    showinfobar: false,
                    lang: "zh",
                    data: [{
                        name: "focus",
                        index: "0",
                        status: 1,
                        order: 0,
                        row: 40,
                        column: 12,
                        celldata: [
                            { r: 0, c: 0, v: { v: 1, m: "1" } },
                            { r: 0, c: 1, v: { f: "=A1*2", v: 2, m: "2" } }
                        ]
                    }]
                };
                if (extra) {
                    for (var key in extra) {
                        option[key] = extra[key];
                    }
                }
                return option;
            }

            function assertScrollStable(name, beforeWindow, beforeOuter, afterWindow, afterOuter) {
                var windowStable = afterWindow === beforeWindow;
                var outerStable = afterOuter === beforeOuter;
                record(name, windowStable && outerStable, "window " + beforeWindow + "→" + afterWindow + ", outer " + beforeOuter + "→" + afterOuter);
            }

            async function run() {
                if (typeof luckysheet === "undefined" || typeof luckysheet.create !== "function") {
                    record("load luckysheet.umd.js", null, "Blocked：需要先产出 dist（Phase 5 gulp build）后再打开本页");
                    render();
                    return;
                }

                var outer = document.getElementById("outer-scroll");
                window.scrollTo(0, 360);
                outer.scrollTop = 180;
                await wait(50);

                luckysheet.create(createSheetOption());
                await wait(400);

                window.scrollTo(0, 360);
                outer.scrollTop = 180;
                await wait(50);

                var beforeWindow = window.scrollY || window.pageYOffset || 0;
                var beforeOuter = outer.scrollTop;
                record("前置：fullscreenmode:false 且页面/嵌套容器已滚动", beforeWindow > 0 || beforeOuter > 0, "window=" + beforeWindow + " outer=" + beforeOuter);

                var cellMain = document.getElementById("luckysheet-cell-main") || document.getElementById(luckysheet.container || "luckysheet");
                if (cellMain) {
                    cellMain.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true }));
                    cellMain.dispatchEvent(new MouseEvent("mouseup", { bubbles: true, cancelable: true }));
                    cellMain.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
                }
                await wait(80);
                assertScrollStable("嵌套单击不滚顶", beforeWindow, beforeOuter, window.scrollY || window.pageYOffset || 0, outer.scrollTop);

                luckysheet.enterEditMode();
                await wait(80);
                assertScrollStable("双击/enterEditMode 不滚顶", beforeWindow, beforeOuter, window.scrollY || window.pageYOffset || 0, outer.scrollTop);

                var functionbox = document.getElementById("luckysheet-functionbox-cell");
                var inputBox = document.getElementById("luckysheet-input-box");
                if (functionbox && inputBox) {
                    functionbox.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", keyCode: 13, which: 13, bubbles: true }));
                    await wait(50);
                    assertScrollStable("公式栏 Enter 不滚顶", beforeWindow, beforeOuter, window.scrollY || window.pageYOffset || 0, outer.scrollTop);

                    luckysheet.enterEditMode();
                    await wait(50);
                    functionbox.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", keyCode: 27, which: 27, bubbles: true }));
                    await wait(50);
                    assertScrollStable("公式栏 ESC 不滚顶", beforeWindow, beforeOuter, window.scrollY || window.pageYOffset || 0, outer.scrollTop);
                } else {
                    record("公式栏 Enter/ESC", null, "公式栏节点不存在");
                }

                if (typeof luckysheet.frozenFirstRow === "function") {
                    luckysheet.frozenFirstRow();
                    await wait(80);
                    window.scrollTo(0, 360);
                    outer.scrollTop = 180;
                    await wait(30);
                    beforeWindow = window.scrollY || window.pageYOffset || 0;
                    beforeOuter = outer.scrollTop;
                    luckysheet.enterEditMode();
                    await wait(80);
                    assertScrollStable("冻结后进入编辑不滚顶", beforeWindow, beforeOuter, window.scrollY || window.pageYOffset || 0, outer.scrollTop);
                } else {
                    record("冻结窗格点击", null, "frozenFirstRow API 不可用");
                }

                var editor = document.getElementById("luckysheet-rich-text-editor");
                record("编辑器节点存在", !!editor);

                render();
            }

            window.addEventListener("load", function () {
                run().catch(function (err) {
                    record("runner", false, String(err && err.message ? err.message : err));
                    render();
                });
            });
        })();
    </script>
</body>
</html>
