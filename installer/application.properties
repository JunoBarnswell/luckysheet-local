# Installed service defaults. The installer replaces @PROGRAMDATA@ with the
# Windows Common Application Data directory and preserves this file on upgrade.
server.address=127.0.0.1
server.port=8082
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.profiles.active=h2
spring.datasource.url=jdbc:h2:file:@PROGRAMDATA@/ReactSheets/data/luckysheet_canonical;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
luckysheet.websocket.allowed-origins=http://127.0.0.1:8082,http://localhost:8082
