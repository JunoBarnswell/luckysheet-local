server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework

spring:
  application:
    name: luckysheet-canonical
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/luckysheet_canonical;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration/h2
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    baseline-description: ${FLYWAY_BASELINE_DESCRIPTION:current-schema}
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      # The connection factory is created lazily by the coordination profile.
      # Single-instance mode does not perform any Redis operation.
      url: ${COORDINATION_REDIS_URL:redis://127.0.0.1:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER:}
          jwk-set-uri: ${AUTH_JWKS_URL:}

luckysheet:
  auth:
    issuer: ${AUTH_ISSUER:}
    audience: ${AUTH_AUDIENCE:}
    jwks-url: ${AUTH_JWKS_URL:}
  websocket:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://127.0.0.1:4180,http://localhost:4180}
  coordination:
    multi-instance: ${COORDINATION_MULTI_INSTANCE:false}
    redis-enabled: ${COORDINATION_REDIS_ENABLED:${COORDINATION_MULTI_INSTANCE:false}}
    redis-url: ${COORDINATION_REDIS_URL:}
    channel: ${COORDINATION_REDIS_CHANNEL:luckysheet:coordination}
    outbox-poll-interval: ${COORDINATION_OUTBOX_POLL_INTERVAL:PT1S}
    outbox-poll-interval-ms: ${COORDINATION_OUTBOX_POLL_INTERVAL_MS:1000}
    outbox-lease: ${COORDINATION_OUTBOX_LEASE:PT30S}
    outbox-batch-size: ${COORDINATION_OUTBOX_BATCH_SIZE:100}
    presence-ttl: ${COORDINATION_PRESENCE_TTL:PT45S}
  query:
    enabled: ${QUERY_EXECUTION_ENABLED:true}
    max-rows: ${QUERY_MAX_ROWS:10000}
    max-columns: ${QUERY_MAX_COLUMNS:500}
    max-response-bytes: ${QUERY_MAX_RESPONSE_BYTES:5000000}
    timeout: ${QUERY_TIMEOUT:PT10S}
    worker-threads: ${QUERY_WORKER_THREADS:4}
    # Credentials are supplied by server deployment configuration/secret
    # binding under this map and are never accepted in a client request.
    sources: {}
  share:
    default-lifetime: ${SHARE_DEFAULT_LIFETIME:PT24H}
    max-lifetime: ${SHARE_MAX_LIFETIME:P30D}
