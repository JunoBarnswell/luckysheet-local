openapi: 3.1.0
info:
  title: React Sheets Workbook API
  version: 2026-08-24
servers:
  - url: /
paths:
  /api/workbooks:
    get:
      operationId: listWorkbooks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Bounded workbook catalog page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbookPage'
    post:
      operationId: createWorkbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkbookRequest'
      responses:
        '201':
          description: Workbook snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
  /api/workbooks/{unitId}/operations:
    post:
      operationId: commitOperation
      parameters:
        - $ref: '#/components/parameters/UnitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationEnvelope'
      responses:
        '201':
          description: Committed operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResponse'
  /api/workbooks/{unitId}/revisions:
    get:
      operationId: listRevisions
      parameters:
        - $ref: '#/components/parameters/UnitId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Bounded revision page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionPage'
  /api/workbooks/{unitId}/assets/{assetId}:
    put:
      operationId: putWorkbookAsset
      parameters:
        - $ref: '#/components/parameters/UnitId'
        - name: assetId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: X-Content-SHA256
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
        - name: X-Asset-MimeType
          in: header
          required: true
          schema: { type: string, pattern: '^image/' }
        - name: X-Asset-Width
          in: header
          required: false
          schema: { type: integer, minimum: 1 }
        - name: X-Asset-Height
          in: header
          required: false
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: Content-addressed image metadata
          content:
            application/json: { schema: { $ref: '#/components/schemas/AssetMetadata' } }
    get:
      operationId: getWorkbookAsset
      parameters:
        - $ref: '#/components/parameters/UnitId'
        - name: assetId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Image bytes
          headers:
            X-Content-SHA256: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
    delete:
      operationId: deleteWorkbookAsset
      parameters:
        - $ref: '#/components/parameters/UnitId'
        - name: assetId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '204': { description: Asset released }
  /api/workbooks/{unitId}/assets/reconcile:
    post:
      operationId: reconcileWorkbookAssets
      parameters: [{ $ref: '#/components/parameters/UnitId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetIds]
              properties:
                assetIds: { type: array, items: { type: string }, uniqueItems: true }
      responses:
        '204': { description: Unreferenced assets released }
  /api/user-preferences:
    get:
      operationId: getUserPreferences
      responses:
        '200':
          description: Actor global preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
    put:
      operationId: putUserPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferencesPatch'
      responses:
        '200':
          description: Updated actor global preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
components:
  parameters:
    UnitId:
      name: unitId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHENTICATED, FORBIDDEN, VALIDATION_ERROR, NOT_FOUND, CONFLICT, WORKBOOK_TRASHED, TIMEOUT, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
        message: { type: string }
        details: { type: object, additionalProperties: true }
    AssetMetadata:
      type: object
      required: [schema, unitId, assetId, contentHash, mimeType, byteLength, updatedAt]
      properties:
        schema: { const: AssetRef }
        unitId: { type: string }
        assetId: { type: string }
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        mimeType: { type: string, pattern: '^image/' }
        byteLength: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    WorkbookSnapshot:
      type: object
      required: [schema, version, unitId, name, sheets, dataModel, dimensionMetrics, calculationSettings, editingOptions, definedNameModels]
      properties:
        schema: { const: WorkbookSnapshot }
        version: { const: 10 }
        unitId: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 255 }
        collationContext: { type: object }
        calculationSettings: { type: object }
        editingOptions: { type: object }
        theme: { type: object }
        definedNameModels: { type: array, items: { $ref: '#/components/schemas/DefinedNameModel' } }
        dimensionMetrics:
          type: object
          required: [normalFontFamily, normalFontSizePx, maximumDigitWidthPx]
          properties:
            normalFontFamily: { type: string, minLength: 1 }
            normalFontSizePx: { type: number, exclusiveMinimum: 0 }
            maximumDigitWidthPx: { type: number, exclusiveMinimum: 0 }
        sheets: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WorksheetSnapshot' } }
        dataModel:
          type: object
          required: [sources, tables, relationships, views]
          properties:
            sources: { type: array, items: { type: object } }
            tables: { type: array, items: { type: object } }
            relationships: { type: array, items: { type: object } }
            views: { type: array, items: { type: object } }
        printDocuments: { type: array, items: { type: object } }
        queryDefinitions: { type: array, items: { type: object } }
        cellStyleTemplates: { type: array, items: { type: object } }
      additionalProperties: false
    DefinedNameModel:
      type: object
      required: [name, formula, scope]
      properties:
        name: { type: string, minLength: 1 }
        formula: { type: string, minLength: 1 }
        scope: { enum: [workbook, sheet] }
        sheetId: { type: string, minLength: 1 }
        anchor: { type: object }
        hidden: { type: boolean }
        comment: { type: string }
      additionalProperties: false
    WorksheetPane:
      oneOf:
        - type: object
          required: [kind]
          properties: { kind: { const: none } }
          additionalProperties: false
        - type: object
          required: [kind, xSplit, ySplit, startRow, startColumn, state]
          properties:
            kind: { enum: [frozen, split] }
            xSplit: { type: number, minimum: 0 }
            ySplit: { type: number, minimum: 0 }
            startRow: { type: integer, minimum: 0 }
            startColumn: { type: integer, minimum: 0 }
            activePane: { enum: [topLeft, topRight, bottomLeft, bottomRight] }
            state: { enum: [frozen, frozenSplit, split] }
    AutoFilter:
      type: object
      required: [sheetId, range, columns]
      properties:
        sheetId: { type: string, minLength: 1 }
        range: { type: object }
        columns: { type: object, additionalProperties: { type: object } }
        sortState: { type: object }
      additionalProperties: false
    WorksheetSnapshot:
      type: object
      required: [kind, id, name, rowCount, columnCount, cells, merges, pane, pivots, sparklines, drawings, drawingPayloads, review, defaultRowHeightPx, defaultColumnWidthPx]
      properties:
        kind: { enum: [worksheet, table-sheet, gantt-sheet, report-sheet] }
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        rowCount: { type: integer, minimum: 1, maximum: 1048576 }
        columnCount: { type: integer, minimum: 1, maximum: 16384 }
        cells:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              not:
                anyOf:
                  - required: [hyperlink]
                  - required: [hyperlinkDetail]
                  - required: [note]
                  - required: [comment]
        merges: { type: array, items: { type: object } }
        pane: { $ref: '#/components/schemas/WorksheetPane' }
        autoFilter: { $ref: '#/components/schemas/AutoFilter' }
        pivots: { type: array, items: { type: object } }
        sparklines: { type: array, items: { type: object } }
        drawings: { type: array, items: { type: object } }
        drawingPayloads: { type: object, additionalProperties: { type: object } }
        review:
          type: object
          required: [notesByCell, notesById, threadIdsByCell, threadsById]
          properties:
            notesByCell: { type: object, additionalProperties: { type: string, minLength: 1 } }
            notesById: { type: object, additionalProperties: { type: object } }
            threadIdsByCell: { type: object, additionalProperties: { type: array, items: { type: string, minLength: 1 } } }
            threadsById: { type: object, additionalProperties: { type: object } }
          additionalProperties: false
        defaultRowHeightPx: { type: number, exclusiveMinimum: 0 }
        defaultColumnWidthPx: { type: number, exclusiveMinimum: 0 }
        rowHeightsPx: { type: object, additionalProperties: { type: number, exclusiveMinimum: 0 } }
        columnWidthsPx: { type: object, additionalProperties: { type: number, exclusiveMinimum: 0 } }
        dataRegions: { type: array }
        sparklineGroups: { type: array }
        conditionalFormats: { type: array }
        dataValidations: { type: array }
        hiddenRows: { type: array, items: { type: integer, minimum: 0 } }
        hiddenColumns: { type: array, items: { type: integer, minimum: 0 } }
        tabColor: { type: string }
        bandedRule: { type: object }
        sheetTables: { type: array }
        spillRanges: { type: array }
        protectionRules: { type: array }
        showGridlines: { type: boolean }
        showHeaders: { type: boolean }
        zoom: { type: number, exclusiveMinimum: 0 }
        hidden: { type: boolean }
        outline: { type: object }
        tableSheet: { type: object }
        ganttSheet: { type: object }
        reportSheet: { type: object }
        drawingGroups: { type: array }
        snapSettings: { type: object }
        hyperlinks: { type: array }
      additionalProperties: false
    CreateWorkbookRequest:
      type: object
      required: [unitId, name, snapshot]
      properties:
        unitId: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 255 }
        snapshot: { $ref: '#/components/schemas/WorkbookSnapshot' }
        spaceId: { type: [string, 'null'] }
        folderId: { type: [string, 'null'] }
    SnapshotResponse:
      type: object
      required: [unitId, snapshot, revision, checksum]
      properties:
        unitId: { type: string }
        snapshot: { $ref: '#/components/schemas/WorkbookSnapshot' }
        revision: { type: integer, minimum: 0 }
        checksum: { type: string }
    OperationEnvelope:
      type: object
      required: [schema, operationId, unitId, clientSequence, baseRevision, mutations, createdAt]
      properties:
        schema: { const: OperationEnvelope }
        operationId: { type: string, minLength: 1 }
        unitId: { type: string, minLength: 1 }
        clientSequence: { type: integer, minimum: 1 }
        baseRevision: { type: integer, minimum: 0 }
        mutations: { type: array, minItems: 1, items: { type: object } }
        createdAt: { type: string, format: date-time }
    CommitResponse:
      type: object
      required: [operation]
      properties:
        operation: { type: object }
    WorkbookPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: object } }
        nextCursor: { type: [string, 'null'] }
    RevisionPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: object } }
        nextCursor: { type: [string, 'null'] }
    UserPreferences:
      type: object
      required: [autoSave, autoSync, offlineCache, importCompatibility, theme]
      properties:
        defaultSpaceId: { type: [string, 'null'] }
        defaultFolderId: { type: [string, 'null'] }
        autoSave: { type: boolean }
        autoSync: { type: boolean }
        offlineCache: { type: boolean }
        importCompatibility: { enum: [A, B, C] }
        language: { type: [string, 'null'] }
        theme: { enum: [light, dark, system] }
    UserPreferencesPatch:
      allOf:
        - $ref: '#/components/schemas/UserPreferences'
